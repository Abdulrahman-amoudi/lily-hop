<script>
(()=>{
'use strict';
const W=320,H=180,WATER=132,G=330;
const SFX_DATA=/*SFX*/{};

/* ================= canvases: low-res game canvas -> WebGL post-process ================= */
const cv=document.getElementById('c');
const src=document.createElement('canvas');src.width=W;src.height=H;
const mainCtx=src.getContext('2d');mainCtx.imageSmoothingEnabled=false;
const refl=document.createElement('canvas');refl.width=W;refl.height=H;
const rctx=refl.getContext('2d');rctx.imageSmoothingEnabled=false;
const uiC=document.createElement('canvas');uiC.width=W;uiC.height=H;const uiCtx=uiC.getContext('2d');
let ctx=mainCtx;
let gl=null,glp=null,gtex=null,gui=null,U={},dctx=null;
function initGL(){try{gl=cv.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false});}catch(e){gl=null;}
  if(!gl){dctx=cv.getContext('2d');return;}
  const vs='attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*0.5+0.5,0.5-p.y*0.5);gl_Position=vec4(p,0.0,1.0);}';
  const fsrc=`precision mediump float;varying vec2 v;uniform sampler2D tex,ui;uniform float time,ab,flash,zoom,wl,fever;
  vec3 S(vec2 u){return texture2D(tex,u).rgb;}
  void main(){vec2 uv=(v-0.5)/zoom+0.5;
    if(uv.y>wl){float d=clamp((uv.y-wl)*25.0,0.0,1.0);uv.x+=sin(uv.y*260.0+time*2.5)*0.0009*d;}
    vec3 c=vec3(S(uv+vec2(ab,0.0)).r,S(uv).g,S(uv-vec2(ab,0.0)).b);
    vec2 px=vec2(1.0/320.0,1.0/180.0);vec3 b=vec3(0.0);
    for(int i=0;i<8;i++){float a=float(i)*0.785398;vec2 o=vec2(cos(a),sin(a));b+=max(S(uv+o*px*2.0)-0.75,0.0);b+=max(S(uv+o*px*4.5)-0.75,0.0)*0.4;}
    c+=b*0.07;
    float l=dot(c,vec3(0.299,0.587,0.114));c=mix(vec3(l),c,1.0+fever*0.12);
    float sl=0.9+0.1*abs(sin(v.y*180.0*3.14159));c*=mix(1.0,sl,0.15);
    c=mix(c,vec3(1.0,0.97,0.88),flash);
    vec4 u=texture2D(ui,v);vec3 ub=vec3(0.0);for(int i=0;i<4;i++){float a=float(i)*1.5708+0.785;ub+=texture2D(ui,v+vec2(cos(a),sin(a))*px*1.5).rgb*texture2D(ui,v+vec2(cos(a),sin(a))*px*1.5).a;}
    c=mix(c,u.rgb,u.a);
    gl_FragColor=vec4(c,1.0);}`;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;};
  try{glp=gl.createProgram();gl.attachShader(glp,sh(gl.VERTEX_SHADER,vs));gl.attachShader(glp,sh(gl.FRAGMENT_SHADER,fsrc));gl.linkProgram(glp);
    if(!gl.getProgramParameter(glp,gl.LINK_STATUS))throw 'link';}catch(e){gl=null;dctx=cv.getContext('2d');return;}
  gl.useProgram(glp);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(glp,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const mk=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;};
  gtex=mk();gui=mk();
  for(const n of['tex','ui','time','ab','flash','zoom','wl','fever'])U[n]=gl.getUniformLocation(glp,n);
  gl.uniform1i(U.tex,0);gl.uniform1i(U.ui,1);gl.uniform1f(U.wl,(WATER+3)/H);}
initGL();
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),k=s>=2?Math.floor(s):s;cv.style.width=Math.round(W*k)+'px';cv.style.height=Math.round(H*k)+'px';
  const r=Math.max(2,Math.min(6,Math.round(k*(window.devicePixelRatio||1))));cv.width=W*r;cv.height=H*r;
  if(gl)gl.viewport(0,0,cv.width,cv.height);if(dctx)dctx.imageSmoothingEnabled=false;}
addEventListener('resize',fit);fit();
const FX={zoom:0,ab:0,flash:0};
function present(){
  if(gl){gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,gui);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,uiC);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,gtex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.uniform1f(U.time,T);gl.uniform1f(U.ab,Math.min(FX.ab,0.0025));gl.uniform1f(U.flash,0);gl.uniform1f(U.zoom,1+FX.zoom);gl.uniform1f(U.fever,game.fever>0?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
  else{dctx.imageSmoothingEnabled=false;dctx.drawImage(src,0,0,cv.width,cv.height);dctx.drawImage(uiC,0,0,cv.width,cv.height);}}

const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const damp=(k,dt)=>1-Math.pow(k,dt);
function hex(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
const hue=(o=0)=>'hsl('+(((T*240+o)%360+360)%360)+',100%,65%)';

/* ================= pixel font 3x5 ================= */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101101111010',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
'!':'010010010000010','?':'110001010000010','.':'000000000000010',':':'000010000010000','-':'000000111000000','+':'000010111010000',"'":'010010000000000',',':'000000000010100',' ':'000000000000000','/':'001001010100100','(':'010100100100010',')':'010001001001010','<':'001010100010001','>':'100010001010100'};
function drawStr(s,x,y,sc,col){ctx.fillStyle=col;for(let i=0;i<s.length;i++){const g=FONT[s[i]]||FONT['?'];for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(g[r*3+c]==='1')ctx.fillRect(x+i*4*sc+c*sc,y+r*sc,sc,sc);}}
function txt(s,x,y,sc=1,col='#fff',al='l',sh='#1a0f2e'){s=String(s).toUpperCase();const w=s.length*4*sc-sc;if(al==='c')x-=w/2;else if(al==='r')x-=w;x=Math.round(x);y=Math.round(y);if(sh)drawStr(s,x+sc,y+sc,sc,sh);drawStr(s,x,y,sc,col);}
function rainbowTxt(s,x,y,sc){s=String(s).toUpperCase();const w=s.length*4*sc-sc;x=Math.round(x-w/2);for(let i=0;i<s.length;i++){const yy=y+Math.round(Math.sin(T*10+i*0.7));drawStr(s[i],x+i*4*sc+sc,yy+sc,sc,'#1a0f2e');drawStr(s[i],x+i*4*sc,yy,sc,hue(i*30));}}

/* ================= skins ================= */
const SKINS=[
 {id:'classic',name:'CLASSIC',g:'#5cc94e',d:'#2f8a3a',h:'#a6ef74',b:'#f1f7b5',o:'#14301a',lv:1},
 {id:'dart',name:'POISON DART',g:'#2f7dff',d:'#1a4bb5',h:'#8cc2ff',b:'#cfe6ff',o:'#0c1c40',lv:3,spots:'#101018'},
 {id:'tomato',name:'TOMATO',g:'#ff6a3d',d:'#b83a1c',h:'#ffb08a',b:'#ffe3c6',o:'#4a1408',lv:5},
 {id:'ninja',name:'NINJA',g:'#4a4468',d:'#2a243e',h:'#7a72a4',b:'#aca4d0',o:'#0e0b18',lv:7,band:'#ff3355'},
 {id:'ghost',name:'GHOST',g:'#dfe9ff',d:'#9fb0e0',h:'#ffffff',b:'#ffffff',o:'#4b5a8a',lv:9,ghost:true},
 {id:'royal',name:'ROYAL',g:'#ffcf3f',d:'#c08a10',h:'#fff0a0',b:'#fff8d8',o:'#5a3a00',record:true,crown:true}];
let save={s:0,x:0,lv:1,skin:'classic',royal:false};
try{const o=JSON.parse(localStorage.getItem('lilyhop2')||'null');if(o)save=Object.assign(save,o);else{const v1=JSON.parse(localStorage.getItem('lilyhop')||'null');if(v1){save.s=v1.s||0;save.x=v1.x||0;}}}catch(e){}
function saveIt(){try{localStorage.setItem('lilyhop2',JSON.stringify(save));}catch(e){}}
const unlocked=s=>s.record?save.royal:save.lv>=s.lv;
const skin=()=>SKINS.find(s=>s.id===save.skin&&unlocked(s))||SKINS[0];
function cycleSkin(d){const list=SKINS.filter(unlocked);let i=list.indexOf(skin());i=(i+d+list.length)%list.length;save.skin=list[i].id;saveIt();sfx('click');frog.sx=1.3;frog.sy=0.75;sparkle(frog.x,frog.y-8,10,false);}
function nextUnlock(){const s=SKINS.find(s=>!unlocked(s)&&!s.record);if(s)return'NEXT: '+s.name+' AT LV '+s.lv;if(!save.royal)return'BEAT YOUR RECORD FOR ROYAL';return'ALL SKINS UNLOCKED!';}

/* ================= frog sprite ================= */
const fs=document.createElement('canvas');fs.width=16;fs.height=16;const fx=fs.getContext('2d');
const P={w:'#ffffff',k:'#141414',m:'#3a1020',p:'#ff8fa8',t:'#ff4f7b'};
function R(c,x,y,w,h){fx.fillStyle=c;fx.fillRect(x,y,w,h);}
function drawFrogSprite(o){const s=o.skin,g=o.bodyCol||s.g;
  fx.clearRect(0,0,16,16);
  if(!o.air){R(s.o,0,10,4,4);R(s.o,12,10,4,4);R(s.d,1,11,2,2);R(s.d,13,11,2,2);R(s.o,0,13,5,2);R(s.o,11,13,5,2);R(s.d,1,13,3,1);R(s.d,12,13,3,1);}
  else{R(s.o,2,11,3,5);R(s.o,11,11,3,5);R(s.d,3,12,1,3);R(s.d,12,12,1,3);R(s.d,2,15,3,1);R(s.d,11,15,3,1);}
  R(s.o,3,5,10,9);R(s.o,2,6,12,7);R(s.o,1,7,14,5);
  R(g,3,6,10,7);R(g,2,7,12,5);R(s.h,4,6,3,1);R(s.h,3,7,1,1);
  if(s.spots){R(s.spots,10,7,2,1);R(s.spots,3,10,1,2);R(s.spots,12,10,1,1);R(s.spots,6,6,1,1);}
  R(s.b,5,10,6,3);R(s.b,4,11,8,1);
  if(o.throat>0.05){const r=Math.round(o.throat*2);R(s.o,5-r,9,6+2*r,4+r);R(P.p,6-r,10,4+2*r,2+r);R(P.w,6-r,10,1,1);}
  R(s.o,2,1,6,6);R(s.o,8,1,6,6);
  if(o.blink){R(g,3,2,4,4);R(g,9,2,4,4);R(s.o,3,4,4,1);R(s.o,9,4,4,1);}
  else{R(P.w,3,2,4,4);R(P.w,9,2,4,4);const px=4+o.ex,py=3+o.ey;R(P.k,px,py,2,2);R(P.k,px+6,py,2,2);}
  if(s.band){R(s.band,1,6,14,1);R(s.band,14,7,2,1);R(s.band,15,8,1,2);}
  if(o.mouth==='open'){R(P.m,6,8,4,2);R(P.t,7,9,2,1);}else if(o.mouth==='o'){R(P.m,7,8,2,2);}else{R(s.o,5,9,6,1);R(s.o,4,8,1,1);R(s.o,11,8,1,1);}
  R(P.p,3,8,1,1);R(P.p,12,8,1,1);}
function drawCrown(x,y){ctx.fillStyle='#5a3a00';ctx.fillRect(x-4,y-1,9,4);ctx.fillStyle='#ffd23f';ctx.fillRect(x-3,y,7,2);ctx.fillRect(x-3,y-2,1,2);ctx.fillRect(x,y-3,1,3);ctx.fillRect(x+3,y-2,1,2);
  ctx.fillStyle='#ff4f7b';ctx.fillRect(x,y,1,1);ctx.fillStyle='#fff8d0';ctx.fillRect(x-3,y-2,1,1);if(Math.floor(T*4)%3===0)ctx.fillRect(x+4,y-4,1,1);}
function drawEyes(x,y,ex,ey,blink){const s=skin();x=Math.round(x);y=Math.round(y);
  ctx.fillStyle=s.o;ctx.fillRect(x-6,y,6,6);ctx.fillRect(x,y,6,6);
  if(blink){ctx.fillStyle=s.g;ctx.fillRect(x-5,y+1,4,4);ctx.fillRect(x+1,y+1,4,4);ctx.fillStyle=s.o;ctx.fillRect(x-5,y+3,4,1);ctx.fillRect(x+1,y+3,4,1);return;}
  ctx.fillStyle='#fff';ctx.fillRect(x-5,y+1,4,4);ctx.fillRect(x+1,y+1,4,4);ctx.fillStyle='#141414';ctx.fillRect(x-4+ex,y+2+ey,2,2);ctx.fillRect(x+2+ex,y+2+ey,2,2);}

/* ================= static backgrounds ================= */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const SKY=['#140b2b','#24123f','#3d1a55','#5e2163','#86306a','#b0456b','#d8636a','#f2886a','#ffb071'];
const skyC=document.createElement('canvas');skyC.width=W;skyC.height=WATER;
(()=>{const c=skyC.getContext('2d'),img=c.createImageData(W,WATER),d=img.data,cols=SKY.map(hex),bh=WATER/(SKY.length-1);
  for(let y=0;y<WATER;y++){const f=y/bh,i=Math.floor(f),fr=f-i;for(let x=0;x<W;x++){const th=(BAYER[(y&3)*4+(x&3)]+0.5)/16,ci=Math.min(SKY.length-1,fr>th?i+1:i),k=(y*W+x)*4;d[k]=cols[ci][0];d[k+1]=cols[ci][1];d[k+2]=cols[ci][2];d[k+3]=255;}}
  c.putImageData(img,0,0);})();
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
(()=>{const c=vig.getContext('2d'),g=c.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*1.0);g.addColorStop(0,'rgba(5,0,15,0)');g.addColorStop(1,'rgba(5,0,15,0.6)');c.fillStyle=g;c.fillRect(0,0,W,H);})();
const stars=Array.from({length:70},()=>({x:Math.floor(rnd(0,W)),y:Math.floor(rnd(0,85)),ph:rnd(0,6.28),sp:rnd(1,4)}));
const clouds=Array.from({length:5},(_,i)=>({x:i*80+rnd(0,40),y:Math.floor(rnd(22,70)),w:Math.floor(rnd(22,44))}));
const bgFlies=Array.from({length:22},()=>({x:rnd(0,W),y:rnd(70,WATER-4),ph:rnd(0,6.28),sp:rnd(0.5,1.5)}));
const RSPAN=W+80;
const ripples=Array.from({length:46},()=>{const y=Math.floor(rnd(WATER+3,H-1));return{x:rnd(0,RSPAN),y,l:Math.floor(rnd(3,12)),p:0.6+(y-WATER)/48*0.7,a:rnd(0.3,0.8),v:rnd(-3,3)};});
const RS=640;
const reeds=Array.from({length:26},()=>({x:rnd(0,RS),h:Math.floor(rnd(10,30)),head:Math.random()<0.6}));
const SUNX=232;
const farH=wx=>WATER-22-10*Math.sin(wx*0.013)-6*Math.sin(wx*0.031+1.3)-3*Math.sin(wx*0.071);
const midH=wx=>WATER-5-(5+4*Math.sin(wx*0.021)+7*Math.abs(Math.sin(wx*0.11))+3*Math.abs(Math.sin(wx*0.37)));

/* ================= audio: recorded CC0 sound effects (no music) ================= */
const GAIN={charge:0.5,click:0.5,croak:0.6,drag:0.7,fever:0.8,fly:0.7,glub:0.8,gold:0.8,jump:0.7,land:0.8,level:0.8,lotus:0.7,nooo:0.7,perfect:0.7,record:0.9,splash:0.9,unlock:0.8,wobble:0.7};
let AC=null,master=null,muted=false,chargeSrc=null,ambStarted=false;const SND={};
function ensureAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);
    for(const k in SFX_DATA){const bin=atob(SFX_DATA[k].split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      AC.decodeAudioData(u.buffer,b=>{SND[k]=b;},()=>{});}}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();}
function startAmbient(){if(ambStarted||!SND.ambient)return;ambStarted=true;const s=AC.createBufferSource();s.buffer=SND.ambient;s.loop=true;const g=AC.createGain();g.gain.value=GAIN.ambient;s.connect(g).connect(master);s.start();}
function sfx(n,rate=1,vol=1){if(!AC||!SND[n])return null;const s=AC.createBufferSource();s.buffer=SND[n];s.playbackRate.value=rate;const g=AC.createGain();g.gain.value=(GAIN[n]||1)*vol;s.connect(g).connect(master);s.start();return s;}
function setMute(m){muted=m;if(master)master.gain.value=m?0:1;}
function stopCharge(){if(chargeSrc){try{chargeSrc.stop();}catch(e){}chargeSrc=null;}}

/* ================= state ================= */
const DEATH=["FROG.EXE STOPPED WORKING","GLUB GLUB GLUB","THAT PAD HAD TRUST ISSUES","SWIMMING? NEVER HEARD OF IT","FROG FORGOT HE CAN SWIM","SPLASH ZONE: 1 FROG","THE FISH SAY HI","SKILL ISSUE (RIBBIT)","HE WAS TOO YOUNG","GRAVITY: 1  FROG: 0","BRB, FISHING FOR MY DIGNITY","10/10 SPLASH. 0/10 LANDING"];
const QUIPS={2:'DRAGONFLIES INCOMING',3:'PADS ARE MOVING?!',4:'SINKING EVEN FASTER',5:'FROG MODE: SWEATY',6:"IT'S GETTING DARK..."};
const ITEM={fly:{pts:3,col:'#fff3a0'},gold:{pts:10,col:'#ffd23f'},drag:{pts:5,col:'#6ee7ff'},beetle:{pts:25,col:'#ff7ae0'}};
let pads,items,parts,texts,rings,fish,frog,game,cam={x:0},shake=0,hit=0,T=0,nightV=0,fishT=4;

function diff(){const L=game.level;return{sink:Math.max(0.85,2.6-(L-1)*0.22),gMin:12+L*3,gMax:Math.min(100,40+L*8),wMin:Math.max(15,30-L*2),wMax:Math.max(22,44-L*2.5),move:L>=3?Math.min(0.55,0.18*(L-2)):0};}
function addPad(cx,w,mv=0,first=false){const p={cx,base:cx,w,y:WATER-1,sink:0,dip:0,timer:null,gone:false,mv,ms:rnd(1,1.8),ph:rnd(0,6.28),flower:Math.random()<0.25,lotus:!first&&Math.random()<0.12,dx:0};pads.push(p);return p;}
function genPads(){let last=pads[pads.length-1];
  while(last.base+last.w/2<cam.x+W+160){const d=diff(),w=Math.round(rnd(d.wMin,d.wMax)),gap=rnd(d.gMin,d.gMax),cx=last.base+last.w/2+gap+w/2;
    const np=addPad(cx,w,Math.random()<d.move?rnd(8,18):0);
    const mid=(last.base+last.w/2+cx-w/2)/2;
    if(gap>22&&Math.random()<0.78){let kind='fly',y=WATER-rnd(16,42);const r=Math.random();
      if(gap>35&&r<0.04+game.level*0.005){kind='beetle';y=WATER-rnd(50,58);}
      else if(gap>50&&r<0.4){kind='gold';y=WATER-rnd(48,58);}
      else if(game.level>=2&&r<0.62){kind='drag';y=WATER-rnd(22,44);}
      items.push({kind,bx:mid+rnd(-6,6),by:y,x:mid,y,ph:rnd(0,6.28),taken:false});}
    last=np;}}

/* ================= update ================= */
function update(dt){const f=frog;
  for(const p of pads){
    if(p.mv){const nx=p.base+Math.sin(T*p.ms+p.ph)*p.mv;p.dx=nx-p.cx;p.cx=nx;}else p.dx=0;
    p.dip*=Math.pow(0.0005,dt);
    if(p.timer!==null&&!p.gone){p.timer-=dt;
      if(p.timer<0.9&&p.timer>0&&Math.random()<dt*14)parts.push({x:p.cx+rnd(-p.w/2,p.w/2),y:WATER+3,vx:0,vy:-18,g:0,life:0.35,col:'#b9c8ff',s:1});
      if(p.timer<=0){p.sink+=dt*14;if(p.sink>7)p.gone=true;}}}
  if(f.state==='sit'||f.state==='charge'){const p=f.pad;f.x+=p.dx;f.y=p.y+p.sink+p.dip*0.6;
    if(p.gone){stopCharge();f.state='air';f.vx=0;f.vy=10;f.pad=null;addText(f.x,f.y-24,'NOOO!','#ff8a8a');sfx('nooo');}}
  const k=damp(0.0005,dt);
  if(f.state==='charge'){f.charge=Math.min(1,f.charge+dt*1.15);f.sx=lerp(f.sx,1+f.charge*0.28,Math.min(1,k*2));f.sy=lerp(f.sy,1-f.charge*0.32,Math.min(1,k*2));
    if(f.charge>=1){f.maxHold+=dt;if(f.maxHold>0.7&&!f.sweat){f.sweat=true;addText(f.x,f.y-26,'!!','#ff7a7a');}
      if(Math.random()<dt*5)parts.push({x:f.x+5,y:f.y-14,vx:rnd(10,35),vy:-45,g:220,life:0.6,col:'#8fd3ff',s:1});}}
  else{f.sx=lerp(f.sx,1,k);f.sy=lerp(f.sy,1,k);}
  if(f.state==='sit'){f.idle+=dt;if(f.idle>2.4){f.idle=-1.5;f.throatT=0.6;sfx('croak',rnd(0.85,1.1));if(game.mode==='play')addText(f.x,f.y-24,pick(['RIBBIT','CROAK','...HOP?','BRRRP']),'#c8ffb0');}}
  if(f.throatT>0){f.throatT-=dt;f.throat=Math.abs(Math.sin((0.6-f.throatT)*Math.PI*5));}else f.throat=0;
  if(f.teeter>0)f.teeter=Math.max(0,f.teeter-dt);
  f.blinkT-=dt;if(f.blinkT<0){f.blink=0.12;f.blinkT=rnd(1.5,4);}if(f.blink>0)f.blink-=dt;
  for(const it of items)itemPos(it);
  if(f.state==='air'){f.prevY=f.y;f.vy+=G*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot=clamp(f.vy/600,-0.35,0.4);
    if(Math.random()<0.8)parts.push({x:f.x+rnd(-2,2),y:f.y-5+rnd(-2,2),vx:-f.vx*0.1,vy:0,g:0,life:0.25,col:game.fever>0?hue(rnd(0,360)):skin().h,s:1,fade:true});
    if(f.vy>0){for(const p of pads){if(p.gone)continue;const top=p.y+p.sink;if(f.prevY<=top+0.5&&f.y>=top&&Math.abs(f.x-p.cx)<=p.w/2+1.5){f.y=top;land(p);break;}}}
    if(f.state==='air'){const mx=f.x+1,my=f.y-7;
      for(const it of items){if(it.taken)continue;const d=Math.hypot(it.x-mx,it.y-my);
        if(d<7)collect(it);else if(!f.tongue&&d<26&&it.x>f.x-6)f.tongue={it,t:0};}
      if(f.y>WATER+3)die();}}
  else if(f.state!=='dead')f.rot=f.teeter>0?Math.sin(T*25)*0.32*(f.teeter/0.75):lerp(f.rot,0,k);
  if(f.tongue){const tg=f.tongue;tg.t+=dt/0.16;if(tg.t>=0.5&&!tg.it.taken)collect(tg.it);if(tg.t>=1)f.tongue=null;}
  if(game.combo>=3&&f.state!=='dead'&&Math.random()<dt*20)parts.push({x:f.x+rnd(-5,5),y:f.y-rnd(2,12),vx:rnd(-8,8),vy:rnd(-40,-20),g:0,life:0.4,col:pick(['#ff9f3f','#ffd23f','#ff5d3a']),s:1,fade:true});
  let tx=1,ty=0;
  if(f.state==='air'){let bf=null,bd=70;for(const it of items){if(it.taken)continue;const d=Math.hypot(it.x-f.x,it.y-f.y);if(d<bd){bd=d;bf=it;}}
    if(bf){tx=Math.sign(bf.x-f.x);ty=Math.sign(bf.y-(f.y-8));}else ty=f.vy>60?1:-1;}
  else if(f.state==='charge')ty=-1;else if(f.state==='dead')tx=Math.round(Math.sin(T*2));
  if(f.teeter>0){tx=Math.round(Math.sin(T*18));ty=-1;}
  f.ex=clamp(tx,-1,1);f.ey=clamp(ty,-1,1);
  if(f.state==='dead'){f.vy=lerp(f.vy,18,damp(0.1,dt));f.y+=f.vy*dt;f.x+=f.vx*dt;f.vx*=Math.pow(0.05,dt);}
  if(game.mode==='dying'){game.overT+=dt;
    if(game.overT>0.75&&!game.glubbed){game.glubbed=true;sfx('glub');addText(f.x+8,WATER-14,'GLUB','#a9d8ff');}
    if(game.overT>1.05){game.mode='over';if(game.newBest){sfx('unlock');confetti(30);}}}
  else if(game.mode==='over')game.overT+=dt;
  if(game.mode==='play'&&game.started){game.t+=dt;
    if(game.t>=game.level*10){game.level++;const L=game.level;sfx('level');shake=Math.max(shake,3);FX.zoom=Math.max(FX.zoom,0.03);
      const sk=SKINS.find(s=>s.lv===L&&!s.record);
      if(sk&&save.lv<L){save.lv=L;saveIt();banner('LEVEL '+L,'NEW SKIN UNLOCKED: '+sk.name+'!',true);setTimeout(()=>sfx('unlock'),300);confetti(30);}
      else{if(save.lv<L){save.lv=L;saveIt();}banner('LEVEL '+L,QUIPS[L]||'GOOD LUCK LOL');}}}
  if(game.fever>0)game.fever=Math.max(0,game.fever-dt);
  if(f.state!=='dead')cam.x+=(f.x-90-cam.x)*damp(0.003,dt);
  game.maxX=Math.max(game.maxX,f.x);
  game.shown+=(game.score-game.shown)*damp(0.0001,dt);if(Math.abs(game.score-game.shown)<0.5)game.shown=game.score;
  genPads();
  pads=pads.filter(p=>p.cx+p.w>cam.x-60||p===f.pad);
  items=items.filter(it=>it.x>cam.x-40&&(!it.taken||(f.tongue&&f.tongue.it===it)));
  fishT-=dt;if(fishT<0){fishT=rnd(4,9);fish.push({x:cam.x+rnd(80,300),t:0,dur:rnd(0.7,1),h:rnd(14,28),dir:Math.random()<0.5?-1:1});}
  for(const fi of fish){const was=fi.t;fi.t+=dt;if(was===0)drops(fi.x,WATER,8,0.6);if(was<fi.dur&&fi.t>=fi.dur){drops(fi.x+fi.dir*22,WATER,10,0.7);rings.push({x:fi.x+fi.dir*22,r:1,life:0.7});}}
  fish=fish.filter(fi=>fi.t<fi.dur+0.1);
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.conf)p.vx=Math.sin(T*4+p.ph)*25;}
  parts=parts.filter(p=>p.life>0&&!(p.g>100&&p.y>WATER+4&&p.vy>0));
  for(const t of texts){t.t+=dt;t.y-=dt*(t.t<0.15?60:14);}texts=texts.filter(t=>t.t<1.1);
  for(const r of rings){r.r+=dt*28;r.life-=dt;}rings=rings.filter(r=>r.life>0);
  if(game.banner){game.banner.t-=dt;if(game.banner.t<=0)game.banner=null;}
  game.pop=Math.max(0,game.pop-dt*4);
  nightV+=(Math.min(0.6,(game.level-1)*0.09)-nightV)*dt*0.6;}

/* ================= render ================= */
function ell(cx,top,w,h,cf){for(let r=0;r<h;r++){const t=((r+0.5)/h)*2-1,half=Math.round(w/2*Math.sqrt(1-t*t));ctx.fillStyle=cf(r,h);ctx.fillRect(cx-half,top+r,half*2,1);}}

function drawSun(){const cx=SUNX,cy=Math.round(94+nightV*60),r=16;
  ctx.globalAlpha=0.06;disc(cx,cy,r+16,'#ffb36b',WATER);ctx.globalAlpha=0.1;disc(cx,cy,r+9,'#ffb36b',WATER);ctx.globalAlpha=0.18;disc(cx,cy,r+4,'#ffc27a',WATER);ctx.globalAlpha=1;
  disc(cx,cy,r,'#ffcf73',WATER);disc(cx,cy-3,r-5,'#fff0b0',WATER);
  [[5,1],[9,1],[12,2],[15,2]].forEach(([o,h])=>{const y=cy+o;if(y<WATER)ctx.drawImage(skyC,cx-r-1,y,2*r+2,Math.min(h,WATER-y),cx-r-1,y,2*r+2,Math.min(h,WATER-y));});
  ctx.globalAlpha=0.025*(1-nightV);ctx.fillStyle='#ffe0a0';
  for(let i=0;i<5;i++){const a=-2.6+i*0.28+Math.sin(T*0.3+i)*0.03;ctx.save();ctx.translate(cx,cy);ctx.rotate(a);ctx.fillRect(0,-1.5,200,3+i%2*2);ctx.restore();}
  ctx.globalAlpha=1;}
function drawCloud(c){const span=W+100,x=Math.round(((c.x-cam.x*0.06-T*2.5)%span+span)%span-50),y=c.y;
  ctx.fillStyle='#8e3a6e';ctx.fillRect(x+2,y+3,c.w-4,1);
  ctx.fillStyle='#d0607a';ctx.fillRect(x,y,c.w,3);ctx.fillRect(x+4,y-2,c.w-10,2);ctx.fillRect(x+8,y-4,Math.round(c.w*0.35),2);
  ctx.fillStyle='#f08a7a';ctx.fillRect(x+5,y-2,Math.round(c.w*0.3),1);ctx.fillRect(x+9,y-4,Math.round(c.w*0.2),1);}
function drawPad(p,jit=true){if(p.sink>9)return;const warn=p.timer!==null&&p.timer<0.9&&!p.gone;
  const cx=Math.round(p.cx-cam.x)+(jit&&warn&&p.timer>0?(Math.random()<0.5?-1:1):0),w=p.w,h=Math.max(4,Math.round(w*0.17)),top=Math.round(p.y+p.sink+p.dip);
  if(cx<-40||cx>W+40)return;
  const flash=warn&&Math.floor(T*14)%2===0;
  const cT=flash?'#e6dd72':'#7ad66b',cM=flash?'#b8ad4c':'#45a84f',cB='#2a7038';
  ctx.globalAlpha=0.3;ctx.fillStyle='#0d0820';ctx.fillRect(cx-Math.round(w/2)+2,top+h,w-4,1);ctx.globalAlpha=1;
  ell(cx,top-1,w+2,h+2,()=>'#173d22');ell(cx,top,w,h,(r,h)=>r<h*0.35?cT:r<h*0.7?cM:cB);
  ctx.fillStyle=cB;ctx.fillRect(cx,top+Math.floor(h/2)-1,Math.round(w*0.3),1);ctx.fillRect(cx-Math.round(w*0.28),top+Math.floor(h/2),Math.round(w*0.2),1);
  ctx.fillStyle='#2b1f52';const nx=cx+Math.round(w*0.2);ctx.fillRect(nx,top-1,3,2);ctx.fillRect(nx+1,top+1,2,1);
  if(p.flower&&!p.lotus){const q=cx-Math.round(w*0.28);ctx.fillStyle='#ff8fc0';ctx.fillRect(q-1,top-2,3,2);ctx.fillRect(q,top-3,1,1);ctx.fillStyle='#ffe066';ctx.fillRect(q,top-2,1,1);}
  if(p.lotus){const q=cx-Math.round(w*0.18),b=Math.round(Math.sin(T*3+p.ph));
    ctx.globalAlpha=0.25+0.15*Math.sin(T*5);ctx.fillStyle='#ffb3e6';ctx.fillRect(q-5,top-9+b,11,9);ctx.globalAlpha=1;
    ctx.fillStyle='#c2407e';ctx.fillRect(q-4,top-3+b,9,2);ctx.fillStyle='#ff8fc0';ctx.fillRect(q-3,top-5+b,7,3);ctx.fillRect(q-4,top-4+b,1,1);ctx.fillRect(q+4,top-4+b,1,1);
    ctx.fillStyle='#ffd6ec';ctx.fillRect(q-1,top-7+b,3,4);ctx.fillRect(q-3,top-6+b,1,2);ctx.fillRect(q+3,top-6+b,1,2);ctx.fillStyle='#ffe066';ctx.fillRect(q,top-5+b,1,1);}}
function drawItem(it,wx,wy){const x=Math.round(wx-cam.x),y=Math.round(wy);if(x<-12||x>W+12)return;const k=it.kind,f=0.6+0.4*Math.sin(T*8+it.ph);
  if(k==='drag'){const d=Math.sign(Math.cos(T*1.3+it.ph))||1;ctx.fillStyle='#6ee7ff';ctx.globalAlpha=0.2*f;ctx.fillRect(x-5,y-4,11,9);ctx.globalAlpha=1;
    ctx.fillStyle='#1d6fa8';ctx.fillRect(x-4*d,y,1,1);ctx.fillStyle='#2bb6e8';for(let i=-3;i<=2;i++)ctx.fillRect(x+i*d,y,1,1);ctx.fillStyle='#bff6ff';ctx.fillRect(x+3*d,y,2*d||1,1);
    const wf=Math.floor(T*30)%2;ctx.fillStyle='rgba(220,250,255,0.85)';ctx.fillRect(x-2,y-1-wf*2,4,1);ctx.fillRect(x-1,y+1+wf*2,3,1);return;}
  const c=k==='gold'?'#ffd23f':k==='beetle'?hue(it.ph*50):'#fff3a0';
  ctx.fillStyle=c;ctx.globalAlpha=0.15*f;ctx.fillRect(x-4,y-4,9,9);ctx.globalAlpha=0.3*f;ctx.fillRect(x-2,y-2,5,5);ctx.globalAlpha=1;
  if(k==='beetle'){ctx.fillStyle='#1a0f2e';ctx.fillRect(x-2,y-2,5,5);ctx.fillStyle=c;ctx.fillRect(x-1,y-2,3,4);ctx.fillStyle=hue(it.ph*50+120);ctx.fillRect(x-2,y-1,1,2);ctx.fillRect(x+2,y-1,1,2);ctx.fillStyle='#fff';ctx.fillRect(x-1,y-2,1,1);
    ctx.fillStyle='#1a0f2e';ctx.fillRect(x-1,y-4,1,2);ctx.fillRect(x+1,y-4,1,2);
    if(Math.floor(T*8)%2){ctx.fillStyle='#fff8d0';ctx.fillRect(x+4,y-4,1,1);ctx.fillRect(x-5,y+3,1,1);}return;}
  ctx.fillRect(x-1,y-1,3,3);ctx.fillStyle='#fff';ctx.fillRect(x,y,1,1);
  const wf=Math.floor(T*20)%2;ctx.fillStyle='rgba(255,255,255,0.75)';ctx.fillRect(x-2,y-2-wf,1,1);ctx.fillRect(x+2,y-2-wf,1,1);
  if(k==='gold'){ctx.fillStyle='#fff8d0';if(Math.floor(T*6)%2){ctx.fillRect(x,y-6,1,3);ctx.fillRect(x,y+4,1,3);ctx.fillRect(x-6,y,3,1);ctx.fillRect(x+4,y,3,1);}
    else{[[3,3],[4,4],[-3,3],[-4,4],[3,-3],[4,-4],[-3,-3],[-4,-4]].forEach(([a,b])=>ctx.fillRect(x+a,y+b,1,1));}}}
function drawFrog(){const f=frog,s=skin();
  let mouth='smile';if(f.state==='air')mouth=f.tongue?'open':f.vy<0?'open':f.vy>150?'o':'smile';else if(f.state==='charge'&&f.charge>=1)mouth='o';if(f.teeter>0)mouth='o';
  drawFrogSprite({skin:s,ex:f.ex,ey:f.ey,blink:f.blink>0&&f.state!=='air',mouth,air:f.state==='air'||f.state==='dead',throat:f.throat,bodyCol:f.maxHold>0?mix(s.g,'#e0623a',Math.min(1,f.maxHold*0.8)):null});
  const w=16*f.sx,h=16*f.sy,jx=(f.state==='charge'&&f.charge>=1)?(Math.random()<0.5?-1:1):0;
  if(f.state==='air'&&ctx===mainCtx){const hgt=WATER-f.y;if(hgt>2){ctx.globalAlpha=clamp(0.35-hgt/200,0.08,0.35);ctx.fillStyle='#0d0820';const sw=Math.round(clamp(10-hgt/8,3,10));ctx.fillRect(Math.round(f.x-cam.x-sw/2),WATER+1,sw,1);ctx.globalAlpha=1;}}
  ctx.save();ctx.translate(Math.round(f.x-cam.x+jx),Math.round(f.y));ctx.rotate(f.rot);
  if(s.ghost)ctx.globalAlpha=0.78+0.12*Math.sin(T*4);
  if(game.fever>0&&ctx===mainCtx){ctx.globalAlpha=0.35;ctx.fillStyle=hue();ctx.fillRect(Math.round(-w/2)-1,Math.round(-h)-1,Math.round(w)+2,Math.round(h)+2);ctx.globalAlpha=1;}
  ctx.drawImage(fs,Math.round(-w/2),Math.round(-h),Math.round(w),Math.round(h));ctx.globalAlpha=1;
  if(s.crown||game.crown)drawCrown(0,Math.round(-h)-2);
  ctx.restore();
  if(f.tongue&&ctx===mainCtx){const tg=f.tongue,e=tg.t<0.5?tg.t*2:(1-tg.t)*2,mx=f.x+1,my=f.y-7*f.sy,ex=mx+(tg.it.x-mx)*e,ey=my+(tg.it.y-my)*e,n=Math.ceil(Math.hypot(ex-mx,ey-my));
    ctx.fillStyle='#ff4f7b';for(let i=0;i<=n;i++){const t=n?i/n:0;ctx.fillRect(Math.round(mx+(ex-mx)*t-cam.x),Math.round(my+(ey-my)*t),2,2);}
    ctx.fillStyle='#ff8fa8';ctx.fillRect(Math.round(ex-cam.x)-1,Math.round(ey)-1,3,3);
    if(tg.t>=0.5)drawItem(tg.it,ex,ey);}}
function drawFish(fi){const t=fi.t/fi.dur;if(t>1)return;const x=fi.x+fi.dir*22*t-cam.x,y=WATER-Math.sin(t*Math.PI)*fi.h;const a=Math.cos(t*Math.PI)*-0.9*fi.dir;
  ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);ctx.scale(fi.dir,1);
  ctx.fillStyle='#7a2a14';ctx.fillRect(-4,-2,8,4);ctx.fillStyle='#ff8a3d';ctx.fillRect(-3,-2,6,3);ctx.fillStyle='#ffd08a';ctx.fillRect(-2,0,4,1);
  ctx.fillStyle='#ff8a3d';ctx.fillRect(-6,-3,2,2);ctx.fillRect(-6,1,2,2);ctx.fillStyle='#fff';ctx.fillRect(2,-1,1,1);ctx.restore();}
function render(){
  ctx=mainCtx;
  const sxs=shake>0?Math.round(rnd(-shake,shake)):0,sys=shake>0?Math.round(rnd(-shake,shake)*0.6):0;shake=Math.max(0,shake-0.5);
  ctx.save();ctx.translate(sxs,sys);
  ctx.drawImage(skyC,0,0);ctx.fillStyle='#140b2b';ctx.fillRect(-10,-10,W+20,10);
  drawSun();clouds.forEach(drawCloud);
  ctx.fillStyle='#4a2259';for(let x=-8;x<W+8;x++){const t=Math.round(farH(x+cam.x*0.15));ctx.fillRect(x,t,1,WATER-t);}
  ctx.fillStyle='rgba(255,150,140,0.10)';ctx.fillRect(-8,WATER-16,W+16,16);
  ctx.fillStyle='#2a1240';for(let x=-8;x<W+8;x++){const t=Math.round(midH(x+cam.x*0.35));ctx.fillRect(x,t,1,WATER-t);}
  if(nightV>0.005){ctx.fillStyle='rgba(8,4,28,'+nightV.toFixed(3)+')';ctx.fillRect(-8,-8,W+16,WATER+8);}
  ctx.fillStyle='#fff';for(const s of stars){const a=nightV*1.6*(0.5+0.5*Math.sin(T*s.sp+s.ph));if(a<0.03)continue;ctx.globalAlpha=Math.min(1,a);ctx.fillRect(s.x,s.y,1,1);}ctx.globalAlpha=1;
  for(const b of bgFlies){const x=Math.round((((b.x-cam.x*0.4+Math.sin(T*b.sp+b.ph)*6)%W)+W)%W),y=Math.round(b.y+Math.cos(T*b.sp*0.8+b.ph)*4),a=(0.3+0.7*(0.5+0.5*Math.sin(T*3+b.ph)))*(0.35+nightV);
    ctx.fillStyle='#fff3a0';ctx.globalAlpha=a*0.25;ctx.fillRect(x-1,y-1,3,3);ctx.globalAlpha=Math.min(1,a);ctx.fillRect(x,y,1,1);}ctx.globalAlpha=1;
  const WCOL=['#3b2b6b','#33255e','#2b1f52','#241a46','#1d153a','#171030'];
  for(let i=0;i<WCOL.length;i++){ctx.fillStyle=WCOL[i];const y0=WATER+i*8;ctx.fillRect(-8,y0,W+16,i===WCOL.length-1?H-y0+8:8);}
  ctx.save();ctx.beginPath();ctx.rect(-8,WATER+1,W+16,H);ctx.clip();ctx.globalAlpha=0.35;ctx.translate(0,2*WATER+1);ctx.scale(1,-1);
  ctx.drawImage(skyC,0,WATER-40,W,40,0,WATER-40,W,40);ctx.restore();
  const scy=94+nightV*60;for(let r=0;r<H-WATER;r+=2){const w=Math.max(0,18-r*0.35-(scy-94)*0.2)*(0.6+0.4*Math.sin(T*3+r*0.7));if(w<1)continue;
    ctx.fillStyle=r<10?'#ffd08a':'#e88a6a';ctx.globalAlpha=(1-nightV)*(1-r/(H-WATER))*0.9;ctx.fillRect(Math.round(SUNX-w/2+Math.sin(T*2+r*0.5)*2),WATER+r+1,Math.round(w),1);}
  ctx.globalAlpha=1;ctx.fillStyle='#5d4b9e';
  for(const rp of ripples){const x=((rp.x-cam.x*rp.p+T*rp.v)%RSPAN+RSPAN)%RSPAN-40;ctx.globalAlpha=rp.a;ctx.fillRect(Math.round(x),rp.y,rp.l,1);}ctx.globalAlpha=1;
  // reflections of pads, items and the frog
  ctx=rctx;rctx.clearRect(0,0,W,H);for(const p of pads)drawPad(p,false);for(const it of items)if(!it.taken)drawItem(it,it.x,it.y);if(frog.state!=='dead')drawFrog();ctx=mainCtx;
  ctx.save();ctx.beginPath();ctx.rect(-8,WATER+2,W+16,H);ctx.clip();ctx.globalAlpha=0.26;ctx.translate(0,2*WATER+3);ctx.scale(1,-1);ctx.drawImage(refl,0,0);ctx.restore();
  if(save.x>120){const x=Math.round(save.x-cam.x);if(x>-20&&x<W+20){ctx.fillStyle='#d9c8ff';ctx.fillRect(x,WATER-30,1,32);ctx.fillStyle='#ff5d7a';
    for(let i=0;i<5;i++){const wv=Math.round(Math.sin(T*6+i*0.8));ctx.fillRect(x+1,WATER-30+i+wv,8-i,1);}txt('BEST',x,WATER-38,1,'#ffd6e0','c');}}
  for(const fi of fish)drawFish(fi);
  for(const p of pads)drawPad(p);
  for(const it of items)if(!it.taken)drawItem(it,it.x,it.y);
  if(frog.state!=='dead'||frog.y<WATER+16)drawFrog();
  ctx.fillStyle='rgba(30,20,62,0.6)';ctx.fillRect(-8,WATER+4,W+16,H-WATER+4);
  ctx.fillStyle='#8a78d0';for(let i=0;i<14;i++){const x=Math.round(((i*37-cam.x+T*6)%(W+40)+W+40)%(W+40))-20;ctx.globalAlpha=0.4+0.3*Math.sin(T*2+i);ctx.fillRect(x,WATER+4,4+(i%3)*2,1);}ctx.globalAlpha=1;
  if(game.mode==='dying'||game.mode==='over'){const ot=game.overT;if(ot>0.5){const bob=Math.round(Math.sin(T*4)*1),rise=Math.min(1,(ot-0.5)*5);
    drawEyes(frog.x-cam.x,WATER-1-Math.round(rise*4)+bob,Math.round(Math.sin(T*1.7)),Math.round(Math.sin(T*2.3)*0.6),Math.floor(T*3)%5===0);
    if(game.crown||skin().crown)drawCrown(Math.round(frog.x-cam.x),WATER-3-Math.round(rise*4)+bob);
    if(Math.floor(T*2)%3===0&&Math.random()<0.15)parts.push({x:frog.x+rnd(-4,4),y:WATER+3,vx:0,vy:-25,g:0,life:0.4,col:'#b9c8ff',s:1});}}
  ctx.fillStyle='#c7b8ff';for(const r of rings){ctx.globalAlpha=Math.min(1,r.life*1.4);const n=Math.max(8,Math.round(r.r*2));for(let i=0;i<n;i++){const a=i/n*6.283;ctx.fillRect(Math.round(r.x-cam.x+Math.cos(a)*r.r),Math.round(WATER+2+Math.sin(a)*r.r*0.22),1,1);}}ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=p.fade?Math.min(1,p.life*4)*0.8:Math.min(1,p.life*3);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-cam.x),Math.round(p.y),p.s,p.s);}ctx.globalAlpha=1;
  for(const r of reeds){const bx=Math.round(((r.x-cam.x*1.35)%RS+RS)%RS-40);if(bx<-10||bx>W+10)continue;const sw=Math.sin(T*1.4+r.x)*2;
    ctx.fillStyle='#0f0a1a';for(let k=0;k<r.h;k++)ctx.fillRect(bx+Math.round(sw*k/r.h),H-k,k<r.h*0.5?2:1,1);
    if(r.head){ctx.fillStyle='#3b1d14';ctx.fillRect(bx+Math.round(sw)-1,H-r.h-5,3,6);ctx.fillStyle='#0f0a1a';ctx.fillRect(bx+Math.round(sw),H-r.h-8,1,3);}}
  for(const t of texts){ctx.globalAlpha=t.t>0.7?Math.max(0,1-(t.t-0.7)/0.4):1;txt(t.s,t.x-cam.x,t.y,t.sc,t.col,'c');}ctx.globalAlpha=1;
  const f=frog;if(f.state==='charge'){const bx=Math.round(f.x-cam.x)-8,by=Math.round(f.y)-26,c=f.charge;ctx.fillStyle='#1a0f2e';ctx.fillRect(bx-1,by-1,18,4);
    ctx.fillStyle=c<0.5?'#7cff6b':c<0.85?'#ffd23f':'#ff5d5d';ctx.fillRect(bx,by,Math.round(16*c),2);
    const vx=42+c*125,vy=-(85+c*115);ctx.fillStyle='#fff';for(let i=1;i<=7;i++){const t=i*0.045;ctx.globalAlpha=1-i/8;ctx.fillRect(Math.round(f.x+vx*t-cam.x),Math.round(f.y-6+vy*t+0.5*G*t*t),1,1);}ctx.globalAlpha=1;}
  ctx.restore();
  ctx.drawImage(vig,0,0);
  if(game.fever>0){const a=0.25+0.1*Math.sin(T*6);ctx.globalAlpha=Math.min(1,game.fever)*a;for(let i=0;i<W;i+=4){ctx.fillStyle=hue(i*2);ctx.fillRect(i,0,4,2);ctx.fillRect(i,H-2,4,2);}
    for(let j=0;j<H;j+=4){ctx.fillStyle=hue(j*2+90);ctx.fillRect(0,j,2,4);ctx.fillRect(W-2,j,2,4);}ctx.globalAlpha=1;}
  ui();}
function skinPicker(y){const s=skin(),n=SKINS.filter(unlocked).length;
  const bob=Math.round(Math.sin(T*5));txt('<',W/2-64-bob,y,2,'#ffd23f');txt('>',W/2+58+bob,y,2,'#ffd23f');
  txt(s.name,W/2,y,2,s.id==='ninja'?'#ff6a85':s.h,'c');txt(n+'/'+SKINS.length+' SKINS  -  '+nextUnlock(),W/2,y+13,1,'#c8b8ff','c');}
function ui(){ctx=uiCtx;uiCtx.clearRect(0,0,W,H);const m=game.mode;
  txt(muted?'MUTE':'SFX',W-4,4,1,muted?'#ff8a8a':'#c8b8ff','r');
  if(m==='title'){const s='LILY HOP',sc=4,w=s.length*16-4;let x=W/2-w/2;
    for(let i=0;i<s.length;i++){const y=22+Math.round(Math.sin(T*3+i*0.6)*3);drawStr(s[i],x+i*16+sc,y+sc,sc,'#1a0f2e');drawStr(s[i],x+i*16,y,sc,i<4?'#9bff8a':'#ffd23f');}
    txt('HOLD TO CHARGE - RELEASE TO HOP',W/2,52,1,'#ffe9d0','c');
    txt('CATCH BUGS. DON\'T SINK. BEAT YOUR RECORD.',W/2,61,1,'#ffb3c6','c');
    if(Math.floor(T*2)%2)txt('TAP OR SPACE',W/2,76,2,'#ffffff','c');
    if(save.s>0)txt('BEST '+save.s,4,4,1,'#ffd23f');
    skinPicker(146);return;}
  const sc=game.pop>0.4?3:2;
  if(game.fever>0)rainbowTxt(Math.round(game.shown),W/2,5,sc);else txt(Math.round(game.shown),W/2,5,sc,'#ffffff','c');
  let hy=20;
  if(game.fever>0){rainbowTxt('FEVER X2  '+Math.ceil(game.fever),W/2,hy,1);hy+=8;}
  if(game.combo>1){txt((game.combo>=3?'ON FIRE! ':'')+'COMBO X'+game.combo,W/2,hy,1,game.combo>=3?'#ff9f3f':'#9bff8a','c');}
  txt('LV '+game.level,4,4,1,'#c8b8ff');txt('BEST '+Math.max(save.s,game.recordHit?game.score:0),4,11,1,game.recordHit?'#9bff8a':'#ffd23f');
  if(game.crown){ctx.save();drawCrown(W/2+((String(Math.round(game.shown)).length*4*sc)/2)+6,7);ctx.restore();}
  if(game.banner){const b=game.banner,a=Math.min(1,b.t*2,(2.6-b.t)*6);ctx.globalAlpha=a;const s=b.t>2.4?4:3;
    if(b.big)rainbowTxt(b.a,W/2,40,s);else txt(b.a,W/2,40,s,'#ffd23f','c');txt(b.b,W/2,59,1,'#ffffff','c');ctx.globalAlpha=1;}
  if(m==='ready'){if(Math.floor(T*2)%2)txt('TAP TO HOP',W/2,60,2,'#ffffff','c');skinPicker(146);}
  if(m==='over'){const a=Math.min(1,game.overT*4);ctx.globalAlpha=a;
    ctx.fillStyle='rgba(20,10,40,0.85)';ctx.fillRect(28,24,W-56,92);ctx.fillStyle='#ffb071';ctx.fillRect(28,24,W-56,1);ctx.fillRect(28,115,W-56,1);ctx.fillRect(28,24,1,92);ctx.fillRect(W-29,24,1,92);
    const ls=game.line.length*8<W-64?2:1;txt(game.line,W/2,32,ls,'#ffb3c6','c');
    txt('SCORE',W/2,48,1,'#c8b8ff','c');txt(game.score,W/2,56,3,'#ffffff','c');
    txt('BEST '+save.s,W/2,77,1,'#ffd23f','c');
    if(game.newBest&&Math.floor(T*6)%2)rainbowTxt('NEW BEST!',W/2,86,2);
    ctx.globalAlpha=1;if(Math.floor(T*2)%2)txt('TAP TO RETRY',W/2,104,1,'#ffffff','c');skinPicker(146);}}

/* ================= loop ================= */
let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;T+=dt;
  if(hit>0)hit-=dt;else update(dt);
  FX.zoom*=Math.pow(0.002,dt);FX.ab*=Math.pow(0.003,dt);FX.flash*=Math.pow(0.0008,dt);
  render();ctx=mainCtx;present();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
